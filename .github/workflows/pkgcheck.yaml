# rOpenSci pkgcheck — runs the same checks used in rOpenSci peer review.
# https://docs.ropensci.org/pkgcheck/
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: pkgcheck

# El action postea los resultados como issue del repo: necesita issues: write
permissions:
  contents: read
  issues: write

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@main
